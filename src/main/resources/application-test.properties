# =========================================
# TEST PROFILE
# =========================================

spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/Mobile_Backend_Test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:nag@123}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================
# JPA
# =========================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================
# JWT
# =========================================

jwt.secret=${TEST_JWT_SECRET:test-secret-for-testing-only}
jwt.access-expiration=${TEST_JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${TEST_JWT_REFRESH_EXPIRATION:2592000000}


# =========================================
# REDIS
# =========================================

spring.data.redis.host=${TEST_REDIS_HOST:localhost}
spring.data.redis.port=${TEST_REDIS_PORT:6379}


# =========================================
# ACTUATOR
# =========================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.enabled=true
management.endpoint.health.show-details=always


# =========================================
# LOGGING
# =========================================

logging.level.root=INFO
logging.level.org.example.jpaentityrelationships=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot.actuate=DEBUG
logging.level.org.springframework.web=DEBUG